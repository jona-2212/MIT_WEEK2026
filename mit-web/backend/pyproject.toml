[project]
name = "job-scam-guardian-ai"
version = "0.3.0"
description = "Backend AI Job Scam Guardian dengan analisis rekrutmen yang dapat ditelusuri."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5.0",
    "fastapi>=0.162,<1.0",
    "httpx>=0.27,<1.0",
    "pillow>=11.3,<13",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "python-multipart>=0.0.22,<1",
    "uvicorn>=0.32,<1.0",
]

[dependency-groups]
dev = [
    "chromadb>=1,<2",
    "pypdf>=6,<7",
    "pytest>=8.3,<10.0",
    "ruff>=0.9,<1.0",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "index:app"

[tool.vercel.scripts]
build = "python scripts/verify_legal_index.py --index data/legal_index"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".uv-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
